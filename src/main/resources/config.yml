backend:
  url: "http://localhost:8000"

api:
  events: "/api/events"
  stats: "/api/stats"
  leaderboard: "/api/leaderboard"

batch:
  size: 10
  minSize: 5
  maxSize: 50
  intervalMs: 5000

rateLimit:
  perSecond: 5
  windowMs: 1000

queue:
  maxSize: 10000

scheduler:
  initialDelayMs: 1000

retry:
  maxAttempts: 3
  delayMs: 1000
  maxDelayMs: 30000
  jitterMs: 300

backpressure:
  enabled: true
  threshold: 0.8

dlq:
  enabled: true

debug:
  enabled: true