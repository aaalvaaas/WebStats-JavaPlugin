backend:
  url: "http://localhost:8000"

api:
  events: "/api/events"
  stats: "/api/stats"
  leaderboard: "/api/leaderboard"

batch:
  size: 10
  intervalTicks: 100

rateLimit:
  perSecond: 5
  windowMillis: 1000

queue:
  maxSize: 10000

scheduler:
  initialDelayTicks: 20

retry:
  maxAttempts: 3
  delayTicks: 100

debug:
  enabled: true