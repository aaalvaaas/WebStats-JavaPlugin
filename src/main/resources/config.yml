backend:
  url: "http://localhost:8000"

api:
  events: "/api/events"
  stats: "/api/stats"
  leaderboard: "/api/leaderboard"

batch:
  size: 10
  intervalMs: 5000

rateLimit:
  perSecond: 5
  windowMs: 1000

queue:
  maxSize: 10000

scheduler:
  initialDelayMs: 1000

retry:
  maxAttempts: 3
  delayMs: 1000

debug:
  enabled: true